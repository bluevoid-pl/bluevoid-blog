<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <!-- Drone - 4 rotors, visible body, 4 straight arms, no guards -->
  <g fill="black">
    <!-- Central body -->
    <rect x="88" y="60" width="24" height="80" rx="4"/>
    <rect x="84" y="132" width="32" height="8" rx="4"/>
    
    <!-- Straight arms -->
    <rect x="85" y="75" width="40" height="8" rx="2" transform="rotate(45 90 90)"/>
    <rect x="115" y="75" width="40" height="8" rx="2" transform="rotate(-45 150 90)"/>
    <rect x="85" y="125" width="40" height="8" rx="2" transform="rotate(-45 90 150)"/>
    <rect x="115" y="125" width="40" height="8" rx="2" transform="rotate(45 150 150)"/>
    
    <!-- Rotor hubs -->
    <circle cx="65" cy="65" r="3.5"/>
    <circle cx="135" cy="65" r="3.5"/>
    <circle cx="65" cy="135" r="3.5"/>
    <circle cx="135" cy="135" r="3.5"/>
    
    <!-- Rotor blades - 2 per rotor -->
    <g stroke="black" stroke-width="3" fill="none">
      <!-- Top left rotor -->
      <line x1="65" y1="65" x2="80" y2="48"/>
      <line x1="65" y1="65" x2="50" y2="80"/>
      <!-- Top right rotor -->
      <line x1="135" y1="65" x2="150" y2="48"/>
      <line x1="135" y1="65" x2="120" y2="80"/>
      <!-- Bottom left rotor -->
      <line x1="65" y1="135" x2="50" y2="120"/>
      <line x1="65" y1="135" x2="80" y2="152"/>
      <!-- Bottom right rotor -->
      <line x1="135" y1="135" x2="150" y2="152"/>
      <line x1="135" y1="135" x2="120" y2="120"/>
    </g>
  </g>
</svg>
