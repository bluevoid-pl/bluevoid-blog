<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <!-- Drone - top-down quadcopter: body, 4 diagonal arms, 4 rotors, nose faces up -->
  <g fill="none" stroke="black" stroke-width="7" stroke-linecap="round">
    <!-- Arms from the body to each rotor hub -->
    <line x1="90" y1="90" x2="56" y2="56"/>
    <line x1="110" y1="90" x2="144" y2="56"/>
    <line x1="90" y1="110" x2="56" y2="144"/>
    <line x1="110" y1="110" x2="144" y2="144"/>
  </g>
  <g fill="black">
    <!-- Rotor hubs -->
    <circle cx="56" cy="56" r="8"/>
    <circle cx="144" cy="56" r="8"/>
    <circle cx="56" cy="144" r="8"/>
    <circle cx="144" cy="144" r="8"/>
    <!-- Central body -->
    <rect x="76" y="76" width="48" height="48" rx="14"/>
    <!-- Nose: points the way the drone moves -->
    <polygon points="100,58 88,76 112,76"/>
  </g>
  <g fill="none" stroke="black" stroke-width="5">
    <!-- Rotor discs -->
    <circle cx="56" cy="56" r="24"/>
    <circle cx="144" cy="56" r="24"/>
    <circle cx="56" cy="144" r="24"/>
    <circle cx="144" cy="144" r="24"/>
  </g>
  <g fill="none" stroke="black" stroke-width="3.5" stroke-linecap="round">
    <!-- Camera gimbal under the nose -->
    <circle cx="100" cy="84" r="9"/>
  </g>
  <g fill="black">
    <!-- Lens -->
    <circle cx="100" cy="84" r="3"/>
  </g>
</svg>
